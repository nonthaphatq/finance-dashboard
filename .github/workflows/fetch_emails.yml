name: Fetch KBank Emails

on:
  schedule:
    # รันทุก 30 นาที (เวลาเป็น UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # ปุ่มสำหรับกดรันมือได้ตลอดเวลา

# ป้องกันไม่ให้รันซ้อนกัน (ห้ามรันซ้อน)
concurrency:
  group: fetch-emails
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch_emails
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CI: "true"
        run: |
          python fetch_emails.py

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error title=Fetch Emails Failed::Workflow fetch_emails failed! Please check Gmail token expiration or Supabase connection."
